name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    name: Portfolio (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [preview, production]
    defaults:
      run:
        working-directory: website
    env:
      CI: true
      TEST_PRODUCTION: ${{ matrix.build == 'production' && 'true' || 'false' }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test desktop and mobile journeys
        run: npm test
      - name: Save browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-${{ matrix.build }}-results
          path: |
            website/playwright-report/
            website/test-results/
          retention-days: 14
