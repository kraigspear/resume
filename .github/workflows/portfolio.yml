name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portfolio:
    name: Portfolio (${{ matrix.build }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        build: [preview, production]
    defaults:
      run:
        working-directory: website
    env:
      CI: true
      TEST_PRODUCTION: ${{ matrix.build == 'production' && 'true' || 'false' }}
      WRANGLER_SEND_METRICS: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build and test desktop and mobile journeys
        run: npm test
      - name: Test GitHub Pages forwarding
        if: matrix.build == 'production'
        run: npm run test:bridge
      - name: Record production source
        if: matrix.build == 'production'
        run: printf '{"commit":"%s"}\n' "$GITHUB_SHA" > dist/release.json
      - name: Save tested production assets
        if: matrix.build == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-production-assets
          path: website/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Save forwarding pages
        if: matrix.build == 'production'
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist-pages/
      - name: Save browser reports and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: portfolio-${{ matrix.build }}-results
          path: |
            website/playwright-report/
            website/test-results/
            website/playwright-report-bridge/
            website/test-results-bridge/
          retention-days: 14

  deploy-production:
    name: Deploy production
    needs: portfolio
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: cloudflare-production
      url: https://kraigspear.net
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Refuse a stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
      - uses: actions/setup-node@v7
        with:
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - uses: actions/download-artifact@v8
        with:
          name: portfolio-production-assets
          path: website/dist/
      - name: Deploy tested assets
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: false
        run: npx wrangler deploy --config ../wrangler.jsonc
      - name: Verify deployed commit
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error "https://kraigspear.net/release.json?commit=$EXPECTED_COMMIT" | jq -e --arg commit "$EXPECTED_COMMIT" '.commit == $commit'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

  deploy-pages:
    name: Deploy forwarding pages
    needs: deploy-production
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified forwarding bridge
        id: deployment
        uses: actions/deploy-pages@v4
